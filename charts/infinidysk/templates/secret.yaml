{{- if include "infinidysk.createSecret" . }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "infinidysk.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "infinidysk.labels" . | nindent 4 }}
  {{- with .Values.commonAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
type: Opaque
stringData:
  {{- range $name, $value := (include "infinidysk.secretValues" . | fromYaml) }}
  {{ $name }}: {{ $value | quote }}
  {{- end }}
{{- end }}
