{{- if .Values.config.useExternalSecret }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "infinidysk.fullname" . }}-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "infinidysk.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.config.externalSecret.refreshInterval }}
  secretStoreRef:
    # This name must match the metadata.name in the `SecretStore`
    name: {{ .Values.config.externalSecret.secretStoreRef.name }}
    kind: {{ .Values.config.externalSecret.secretStoreRef.kind }}
  target:
    name: {{ include "infinidysk.fullname" . }}-config
    template:
      engineVersion: v2
  data:
{{- range $secret := .Values.config.externalSecret.data }}
  - secretKey: {{ $secret.secretKey }}
    remoteRef:
      conversionStrategy: Default
      decodingStrategy: None
      key: {{ $secret.key }}
      metadataPolicy: None
      nullBytePolicy: Ignore
{{- end }}
{{- end }}
