##    nfs:
##      server: 192.168.x.x
##      path: /media

## @param terminationGracePeriodSeconds Time the pod gets to unmount the FUSE mount and close provider connections
terminationGracePeriodSeconds: 60

## @section infinidysk container's liveness probe parameters
## The probe asks /healthz, which reports the database, the mount and the import worker.
livenessProbe:
  ## @param livenessProbe.enabled Enable livenessProbe on the infinidysk container
  enabled: true
  ## @param livenessProbe.initialDelaySeconds Initial delay seconds for livenessProbe
  initialDelaySeconds: 30
  ## @param livenessProbe.periodSeconds Period seconds for livenessProbe
  periodSeconds: 30
  ## @param livenessProbe.timeoutSeconds Timeout seconds for livenessProbe
  timeoutSeconds: 10
  ## @param livenessProbe.failureThreshold Failure threshold for livenessProbe
  failureThreshold: 6
  ## @param livenessProbe.successThreshold Success threshold for livenessProbe
  successThreshold: 1

## @section infinidysk container's readiness probe parameters
readinessProbe:
  ## @param readinessProbe.enabled Enable readinessProbe on the infinidysk container
  enabled: true
  ## @param readinessProbe.initialDelaySeconds Initial delay seconds for readinessProbe
  initialDelaySeconds: 5
  ## @param readinessProbe.periodSeconds Period seconds for readinessProbe
  periodSeconds: 10
  ## @param readinessProbe.timeoutSeconds Timeout seconds for readinessProbe
  timeoutSeconds: 5
  ## @param readinessProbe.failureThreshold Failure threshold for readinessProbe
  failureThreshold: 3
  ## @param readinessProbe.successThreshold Success threshold for readinessProbe
  successThreshold: 1

## @section infinidysk container's startup probe parameters
## Enable this when the first start imports a 1.x install: that import can take minutes, and
## the default failureThreshold gives it 10 minutes before the liveness probe takes over.
startupProbe:
  ## @param startupProbe.enabled Enable startupProbe on the infinidysk container
  enabled: false
  ## @param startupProbe.initialDelaySeconds Initial delay seconds for startupProbe
  initialDelaySeconds: 10
  ## @param startupProbe.periodSeconds Period seconds for startupProbe
  periodSeconds: 10
  ## @param startupProbe.timeoutSeconds Timeout seconds for startupProbe
  timeoutSeconds: 5
  ## @param startupProbe.failureThreshold Failure threshold for startupProbe
  failureThreshold: 60
  ## @param startupProbe.successThreshold Success threshold for startupProbe
  successThreshold: 1

## @section Ingress parameters
ingress:
  ## @param ingress.enabled Enable ingress record generation for infinidysk
  enabled: false
  ## @param ingress.className IngressClass that will be used to implement the Ingress (Kubernetes 1.18+)
  className: ""
  ## @param ingress.annotations Additional annotations for the Ingress resource
  annotations: {}
  ## @param ingress.hosts An array with hosts and paths
  hosts:
    - host: infinidysk.example.com
      paths:
        - path: /
          pathType: Prefix
  ## @param ingress.tls TLS configuration for the Ingress
  tls: []

## @section Gateway API (HTTPRoute) parameters
route:
  main:
    ## @param route.main.enabled Enable HTTPRoute resource generation via templates
    ##   Set to `false` to skip creating an HTTPRoute for the chart.
    enabled: false
    ## @param route.main.hostnames List of hostnames the HTTPRoute should match
    ##   Example: infinidysk.example.com
    hostnames:
      - infinidysk.example.com
    ## @param route.main.parentRefs List of Gateway parentRefs to attach the HTTPRoute to
    ##   Multiple parentRefs allow attaching the route to several Gateways.
    ##   Each entry may include `name`, `group`, `kind`, and `namespace`.
    parentRefs: []
      # - name: cilium-gateway
      #   group: gateway.networking.k8s.io
      #   kind: Gateway
      #   namespace: kube-system

## @section Network Policy configuration
networkPolicy:
  ## @param networkPolicy.enabled Specifies whether a NetworkPolicy should be created
  enabled: false
  ## @param networkPolicy.allowExternal Don't require client label for connections
  allowExternal: true
  ## @param networkPolicy.allowExternalEgress Allow all egress traffic
  ##   infinidysk needs to reach the Usenet providers, so egress is open by default.
  ##   Set this to `false` and list the destinations in networkPolicy.extraEgress instead.
  allowExternalEgress: true
  ## @param networkPolicy.ingressNSMatchLabels Labels to match to allow traffic from other namespaces
  ingressNSMatchLabels: {}
  ## @param networkPolicy.ingressNSPodMatchLabels Pod labels to match to allow traffic from other namespaces
  ingressNSPodMatchLabels: {}
  ## @param networkPolicy.extraIngress Additional ingress rules
  extraIngress: []
  ## @param networkPolicy.extraEgress Additional egress rules
  extraEgress: []

## @section Metrics parameters
## infinidysk exports Prometheus metrics itself, so there is no exporter sidecar. The /metrics
## endpoint sits behind the admin API key, which scrapers send as `Authorization: Bearer`.
metrics:
  ## @param metrics.enabled Serve Prometheus metrics on /metrics (INFINIDYSK__METRICS__PROMETHEUS)
  enabled: false
  ## Prometheus ServiceMonitor configuration
  serviceMonitor:
    ## @param metrics.serviceMonitor.enabled Create a ServiceMonitor resource for scraping metrics using PrometheusOperator
    enabled: false
    ## @param metrics.serviceMonitor.namespace Namespace in which to create the ServiceMonitor resource
    namespace: ""
    ## @param metrics.serviceMonitor.interval Interval at which metrics should be scraped
    interval: 1m
    ## @param metrics.serviceMonitor.scrapeTimeout Timeout after which the scrape is ended
    scrapeTimeout: ""
    ## @param metrics.serviceMonitor.path Path the metrics are scraped from
    path: /metrics
    ## @param metrics.serviceMonitor.bearerTokenSecret Secret holding the admin API key the scraper sends as a bearer token
    ##   Defaults to the Secret this chart creates when auth.apiKey is set.
    bearerTokenSecret:
      name: ""
      key: ""
    ## @param metrics.serviceMonitor.relabelings Specify additional relabeling of metrics
    relabelings: []
    ## @param metrics.serviceMonitor.metricRelabelings Specify additional metric relabeling of metrics
    metricRelabelings: []
    ## @param metrics.serviceMonitor.honorLabels Honor metrics labels
    honorLabels: false
    ## @param metrics.serviceMonitor.selector Prometheus instance selector labels
    selector: {}
    ## @param metrics.serviceMonitor.annotations Additional custom annotations for the ServiceMonitor
    annotations: {}
    ## @param metrics.serviceMonitor.namespaceSelector Namespace selector for the ServiceMonitor
    namespaceSelector: {}

