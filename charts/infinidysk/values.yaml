## @section Global parameters
global:
  ## @param global.imageRegistry Global Docker Image registry
  imageRegistry: ""
  ## @param global.imagePullSecrets Global Docker registry secret names as an array
  imagePullSecrets: []

## @section Common parameters
## @param nameOverride String to partially override infinidysk.fullname
nameOverride: ""
## @param fullnameOverride String to fully override infinidysk.fullname
fullnameOverride: ""
## @param commonLabels Labels to add to all deployed objects
commonLabels: {}
## @param commonAnnotations Annotations to add to all deployed objects
commonAnnotations: {}

## @section infinidysk image parameters
image:
  ## @param image.registry infinidysk image registry
  registry: ghcr.io
  ## @param image.repository infinidysk image repository (2.x uses infinidysk-next, 1.x uses infinidysk)
  repository: infinidysk/infinidysk-next
  ## @param image.tag infinidysk image tag (immutable tags are recommended, `edge` tracks the newest 2.x release)
  tag: "v2.0.0-beta.11"
  ## @param image.imagePullPolicy infinidysk image pull policy
  imagePullPolicy: IfNotPresent

## @section infinidysk Authentication parameters
## The admin account itself is created in the web UI on first start. Create it before the
## service is reachable from an untrusted network: until an admin exists, anyone who reaches
## the page can create one.
auth:
  ## @param auth.saEnabled Create a ServiceAccount for infinidysk
  saEnabled: false
  ## @param auth.createSecret Create a Secret from the credentials below and load it with envFrom
  createSecret: true
  ## @param auth.existingSecret Name of an existing Secret whose keys are INFINIDYSK__… variables (loaded with envFrom)
  existingSecret: ""
  ## @param auth.apiKey Admin API key (INFINIDYSK__AUTH__API_KEY), also used to scrape /metrics. Generated by infinidysk when empty
  apiKey: ""
  ## @param auth.sessionKey Key that signs UI session cookies (INFINIDYSK__AUTH__SESSION_KEY). Generated by infinidysk when empty
  sessionKey: ""
  ## @param auth.sabApiKey SABnzbd API key the Arr apps use as the download client (INFINIDYSK__SAB__API_KEY). Generated by infinidysk when empty
  sabApiKey: ""
  ## @param auth.webdavUser WebDAV user name (INFINIDYSK__WEBDAV__USER)
  webdavUser: ""
  ## @param auth.webdavPassword WebDAV password (INFINIDYSK__WEBDAV__PASSWORD). Generated by infinidysk when empty
  webdavPassword: ""

## @section infinidysk configuration parameters
## Settings live in the database and are edited in the UI. Any setting can be forced with an
## environment variable; this chart builds those variables from `config.settings` and
## `config.secretSettings`. See https://www.infinidysk.com/v2/reference/environment/
config:
  ## @param config.timezone Time zone for the maintenance window and file dates (TZ)
  timezone: "Europe/Zurich"
  ## @param config.puid Owner shown on files in the mount (PUID)
  puid: 1000
  ## @param config.pgid Group shown on files in the mount (PGID)
  pgid: 1000
  ## @param config.logLevel Log filter (RUST_LOG)
  logLevel: "info"
  database:
    ## @param config.database.url Database URL (INFINIDYSK_DATABASE_URL). Empty keeps the SQLite database in /config
    ## Example: postgres://infinidysk:password@postgresql:5432/infinidysk
    url: ""
    ## @param config.database.existingSecret Name of an existing Secret holding the database URL (takes precedence over config.database.url)
    existingSecret: ""
    ## @param config.database.existingSecretKey Key in config.database.existingSecret holding the database URL
    existingSecretKey: "database-url"
  ## @param config.settings Settings forced through INFINIDYSK__<SECTION>__<KEY> variables, keyed by setting path
  ## Lists and objects may be written as YAML; the chart renders them as the JSON infinidysk expects.
  settings: {}
  ##   performance.preset: balanced
  ##   network.public_url: https://infinidysk.example.com
  ##   sab.categories:
  ##     - tv
  ##     - movies
  ##   imports.library_dirs:
  ##     - path: /data/media
  ## @param config.secretSettings Settings that hold secrets, keyed by setting path. Stored in the chart Secret instead of the pod spec
  secretSettings: {}
  ##   providers:
  ##     - id: 0190f6c4-0000-7000-8000-000000000001
  ##       profile: newshosting
  ##       username: user
  ##       password: password
  ##       max_connections: 50
  ##   arr_instances:
  ##     - id: 0190f6c4-0000-7000-8000-000000000002
  ##       name: Sonarr
  ##       profile: sonarr
  ##       url: http://sonarr:8989
  ##       api_key: changeme
  ## @param config.useExternalSecret Use an ExternalSecret to pull the INFINIDYSK__… variables from a secrets manager
  useExternalSecret: false
  externalSecret:
    refreshInterval: 1h
    secretStoreRef:
      name: ""
      kind: ""
    data: []
    ## - secretKey: INFINIDYSK__PROVIDERS
    ##   key: ""
    ## - secretKey: INFINIDYSK__SAB__API_KEY
    ##   key: ""

## @section Mount parameters
## infinidysk mounts its library with FUSE. That needs /dev/fuse, the SYS_ADMIN capability and
## an unconfined AppArmor profile (see containerSecurityContext). Without them, set
## `mount.fuse: false` and serve the library over WebDAV only.
mount:
  ## @param mount.fuse Enable the built-in FUSE mount (INFINIDYSK__MOUNT__FUSE)
  fuse: true
  ## @param mount.dir Where the library is mounted, as the Arr apps see it (INFINIDYSK__MOUNT__DIR)
  dir: /mnt/infinidysk
  ## @param mount.devFusePath Host path of the FUSE device
  devFusePath: /dev/fuse
  bdi:
    ## @param mount.bdi.enabled Mount the host's FUSE tuning directory so infinidysk can raise read_ahead_kb
    enabled: true
    ## @param mount.bdi.path Host path of the backing device information directory
    path: /sys/devices/virtual/bdi
  hostPath:
    ## @param mount.hostPath.enabled Mount a host directory so the FUSE mount is visible on the node and in other pods
    ## This needs `containerSecurityContext.privileged: true`, because Kubernetes only allows
    ## Bidirectional mount propagation for privileged containers.
    enabled: false
    ## @param mount.hostPath.path Host directory that holds the mount (the parent of mount.dir)
    path: /mnt
    ## @param mount.hostPath.mountPath Path the host directory is mounted at in the container
    mountPath: /mnt
    ## @param mount.hostPath.mountPropagation Mount propagation for the host directory
    mountPropagation: Bidirectional

## @section infinidysk service parameters
service:
  ## @param service.type infinidysk service type
  type: ClusterIP
  ## @param service.port infinidysk service port, shared by the UI, the SABnzbd API and WebDAV
  port: 3000
  ## @param service.nodePort Node port for the infinidysk service
  nodePort: ""
  ## @param service.clusterIP Static cluster IP or "None" for headless service
  clusterIP: ""
  ## @param service.annotations Additional custom annotations for the infinidysk service
  annotations: {}

## @section Persistence parameters
## The config folder holds the SQLite database, the logs, the backups, the disk cache and the
## saved PAR2 repair data. Enable persistence for anything but a throwaway install.
persistence:
  ## @param persistence.enabled Enable persistence of /config using PVC
  enabled: false
  ## @param persistence.storageClass PVC Storage Class for the config volume
  storageClass: ""
  ## @param persistence.accessModes PVC Access modes
  accessModes:
    - ReadWriteOnce
  ## @param persistence.size PVC Storage Request for the config volume
  size: 10Gi
  ## @param persistence.annotations Additional custom annotations for the PVC
  annotations: {}
  ## @param persistence.selector Additional labels for the PVC
  selector: {}

## @section Pod Security Context
podSecurityContext:
  ## @param podSecurityContext.enabled Enable the infinidysk pod Security Context
  enabled: true
  ## @param podSecurityContext.fsGroup Set the infinidysk pod's Security Context fsGroup
  fsGroup: 1000
  ## @param podSecurityContext.fsGroupChangePolicy Set the infinidysk pod's Security Context fsGroupChangePolicy
  fsGroupChangePolicy: "OnRootMismatch"  # only chown if root dir ownership is wrong

## @section Container Security Context
## infinidysk mounts a FUSE filesystem, so the container runs as root and keeps SYS_ADMIN.
## File ownership inside the mount follows config.puid and config.pgid instead.
## With `mount.fuse: false` you can drop the capability and the AppArmor profile and run as an
## unprivileged user.
containerSecurityContext:
  ## @param containerSecurityContext.runAsUser Set the infinidysk container's Security Context runAsUser
  runAsUser: 0
  ## @param containerSecurityContext.runAsGroup Set the infinidysk container's Security Context runAsGroup
  runAsGroup: 0
  ## @param containerSecurityContext.runAsNonRoot Set the infinidysk container's Security Context runAsNonRoot
  runAsNonRoot: false
  ## @param containerSecurityContext.allowPrivilegeEscalation Set the infinidysk container's privilege escalation
  allowPrivilegeEscalation: true
  ## @param containerSecurityContext.privileged Run the infinidysk container privileged (required for mount.hostPath)
  privileged: false
  ## @param containerSecurityContext.capabilities Capabilities for the infinidysk container
  capabilities:
    add:
      - SYS_ADMIN
  ## @param containerSecurityContext.appArmorProfile AppArmor profile for the infinidysk container (Kubernetes 1.30+)
  appArmorProfile:
    type: Unconfined

## @section Resources parameters
resources: {}
  ## @param resources.limits The resources limits for the infinidysk containers
  ## The read-ahead and cache sizes come from performance.preset; the balanced preset holds
  ## up to ~1.2Gi for read-ahead and the memory cache together.
  ## limits:
  ##   memory: 2Gi
  ## @param resources.requests The requested resources for the infinidysk containers
  ## requests:
  ##   memory: 1Gi
  ##   cpu: 250m

